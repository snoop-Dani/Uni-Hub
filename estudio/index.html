<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesiones de estudio · Uni-Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <meta name="theme-color" content="#6B843A">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="estudio.css?v=1">
</head>
<body>

  <header class="banner">
    <span class="app-title"><a class="volver" href="../">← Uni-Hub</a> · SESIONES DE ESTUDIO</span>
    <div class="banner-main">
      <div>
        <h1>Mis sesiones de estudio</h1>
        <p>Estudio con pomodoros y veo cuántas horas le dedico a cada materia</p>
      </div>
    </div>
  </header>

  <main>
    <!-- Resumen: hoy, semana, racha, sesiones -->
    <div class="stats" id="stats"></div>

    <div class="columnas">
      <!-- Temporizador -->
      <section class="reloj" id="reloj"></section>

      <!-- Esta semana: meta y horas por materia -->
      <section class="panel" id="semana"></section>
    </div>

    <!-- Historial de sesiones -->
    <section class="panel" id="historial"></section>
  </main>

  <!-- Formulario para anotar una sesión a mano (aparece encima) -->
  <div class="hoja-fondo" id="hoja" hidden>
    <form class="hoja" id="form" novalidate></form>
  </div>
  <datalist id="materias"></datalist>

  <script src="../carrera/malla.js?v=4"></script>
  <script src="estudio.js?v=1"></script>
</body>
</html>
