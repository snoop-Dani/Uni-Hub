<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregas y exámenes · Uni-Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <meta name="theme-color" content="#6B843A">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="entregas.css?v=1">
</head>
<body>

  <header class="banner">
    <span class="app-title"><a class="volver" href="../">← Uni-Hub</a> · ENTREGAS Y EXÁMENES</span>
    <div class="banner-main">
      <div>
        <h1>Mis entregas</h1>
        <p>Tareas, reportes, quices y exámenes: sé qué viene y no se me pasa nada</p>
      </div>
      <button class="btn blanco" data-nueva>＋ Agregar entrega</button>
    </div>
  </header>

  <main>
    <!-- Resumen: atrasadas, hoy y mañana, esta semana, hechas -->
    <div class="stats" id="stats"></div>

    <!-- Filtro por materia -->
    <div class="filtros" id="filtros"></div>

    <!-- Lista agrupada por cuándo vence -->
    <section id="lista"></section>
  </main>

  <!-- Formulario para agregar o editar (aparece encima) -->
  <div class="hoja-fondo" id="hoja" hidden>
    <form class="hoja" id="form" novalidate></form>
  </div>
  <datalist id="materias"></datalist>

  <script src="../carrera/malla.js?v=4"></script>
  <script src="entregas.js?v=1"></script>
</body>
</html>
