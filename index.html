<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uni-Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Uni-Hub">
  <meta name="theme-color" content="#6B843A">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="hub.css?v=3">
</head>
<body>

  <header class="banner">
    <span class="app-title">UNI-HUB</span>
    <div class="banner-main">
      <div>
        <h1>Hola Daniela</h1>
        <p>Ing. biomédica · mi centro de control universitario</p>
      </div>
      <p class="hoy" id="fecha-hub"></p>
    </div>
  </header>

  <main>
    <div class="section-head">
      <h2>Mis módulos</h2>
      <span id="cuenta"></span>
    </div>
    <div class="modulos" id="modulos"></div>

    <!-- Respaldo: descargar y restaurar los datos de todos los módulos -->
    <section class="respaldo">
      <div>
        <h2>💾 Mis datos</h2>
        <p>Mis datos se guardan solo en este navegador. Descargo un respaldo de vez en cuando, o para pasarlos a otro dispositivo.</p>
        <p class="estado" id="respaldo-estado"></p>
      </div>
      <div class="acciones">
        <button class="btn verde" id="b-descargar">💾 Descargar respaldo</button>
        <button class="btn" id="b-restaurar">📂 Restaurar respaldo</button>
        <button class="btn" id="b-deshacer" hidden>↶ Deshacer la restauración</button>
        <input type="file" id="archivo" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>

  <script src="hub.js?v=8"></script>
</body>
</html>
