<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios · Uni-Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <meta name="theme-color" content="#6B843A">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="horarios.css?v=1">
</head>
<body>

  <header class="banner">
    <span class="app-title"><a class="volver" href="../">← Uni-Hub</a> · HORARIOS</span>
    <div class="banner-main">
      <div>
        <h1>Armo mi horario</h1>
        <p>Pruebo varias opciones por cuatrimestre y elijo la mía</p>
      </div>
      <label class="periodo">Cuatrimestre
        <select id="periodo"></select>
      </label>
    </div>
  </header>

  <main>
    <!-- Pestañas de opciones (A, B, C…) y sus botones -->
    <section class="panel">
      <div class="opciones" id="opciones"></div>
      <div class="acciones" id="acciones"></div>
    </section>

    <!-- Resumen: clases, horas, choques, sin cupo -->
    <div class="stats" id="stats"></div>

    <!-- Cuadrícula semanal -->
    <section class="panel" id="cuadricula"></section>

    <!-- Lista de clases de la opción -->
    <section id="clases"></section>
  </main>

  <!-- Formulario para agregar o editar una clase (aparece encima) -->
  <div class="hoja-fondo" id="hoja" hidden>
    <form class="hoja" id="form" novalidate></form>
  </div>
  <datalist id="materias"></datalist>

  <script src="../carrera/malla.js?v=4"></script>
  <script src="horarios.js?v=2"></script>
</body>
</html>
